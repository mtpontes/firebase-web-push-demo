<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCM Test Client</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #token-display { word-break: break-all; background: #f0f0f0; padding: 10px; margin-top: 10px; border-radius: 5px; }
    #messages { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
    .message { background: #eef; padding: 10px; margin-bottom: 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>FCM Receiver</h1>
  
  <div>
    <h3>Registration Token</h3>
    <p>Copy this token to send messages to this client.</p>
    <div id="token-display">Waiting for permission...</div>
    <button id="request-permission-btn">Request Permission</button>
  </div>

  <div id="messages">
    <h3>Messages Received (Foreground)</h3>
    <div id="message-list"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
